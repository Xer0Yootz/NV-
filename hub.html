<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinity 6 Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { background:#05010f; color:#f5f0ff; font-family:"VT323", "Share Tech Mono", monospace; font-size:18px; margin:0; min-height:100vh; display:grid; place-items:center; }
    .bg { position:fixed; inset:0; background-image:url("ships-bridge.jpg"); background-size:cover; background-position:center; z-index:0; transform:scale(1.12); will-change:transform; transition:transform .35s ease-out; pointer-events:none; }
    main { position:relative; z-index:2; width:100%; max-width:560px; padding:32px; box-sizing:border-box; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.88); }
    button { background:transparent; color:#f5f0ff; border:1px solid #f5f0ff; border-radius:0; padding:10px 18px; font-weight:700; cursor:pointer; }
    a { color:#a78bfa; }
    .cursor-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite; color:#ffffff; }
    .ticker { position:fixed; top:0; left:0; right:0; z-index:4; overflow:hidden; white-space:nowrap; padding:10px 12px; font-size:13px; letter-spacing:2px; background:rgba(5,1,15,.72); border:1px solid #7c3aed; box-sizing:border-box; color:#f5f0ff; }
    .options-footer { position:fixed; bottom:8px; left:8px; right:8px; z-index:3; display:grid; grid-template-columns:1fr auto; gap:8px; font-size:15px; border:1px solid #7c3aed; box-sizing:border-box; background:rgba(18,8,31,.88); }
    .footer-cell { border:1px solid #7c3aed; background:rgba(18,8,31,.88); padding:6px 10px; text-align:center; }
    .options-footer a { color:#a78bfa; }
    .options-footer button { font-size:13px; padding:4px 8px; }
    .options-footer .options-icon-btn { background:transparent; border:0; padding:0; cursor:pointer; line-height:0; }
    #stationSelect { background:transparent; color:#f5f0ff; border:1px solid #f5f0ff; border-radius:0; font-family:inherit; font-size:13px; padding:4px; }
    #stationSelect option { color:#05010f; }
    .options-footer p { display:inline; margin:0 8px 0 0; }
    #nameInput { background:transparent; border:0; outline:none; caret-color:transparent; color:#f5f0ff; font-family:inherit; font-size:inherit; padding:0; margin:0; width:1ch; }
    #who { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; text-align:left; max-width:340px; margin:0 auto; }
    .user-label { grid-column:1; }
    .name-cell { grid-column:2; white-space:nowrap; }
    .save-cell { grid-column:2; }
    #nameEdit { display:inline; }
    .palette-hint { font-size:13px; color:#a78bfa; margin-top:18px; cursor:pointer; }
    .palette-overlay { position:fixed; inset:0; z-index:10; background:rgba(5,1,15,.72); display:none; }
    .palette-overlay.open { display:block; }
    .palette { max-width:560px; margin:15vh auto 0; border:1px solid #7c3aed; background:rgba(18,8,31,.97); text-align:left; }
    #paletteInput { width:100%; box-sizing:border-box; background:transparent; border:0; border-bottom:1px solid #7c3aed; outline:none; color:#f5f0ff; font-family:inherit; font-size:20px; padding:14px 16px; }
    .palette-list { list-style:none; margin:0; padding:6px 0; max-height:50vh; overflow:auto; }
    .palette-item { padding:10px 16px; cursor:pointer; }
    .palette-item .hint { float:right; color:#a78bfa; font-size:13px; }
    .palette-item.selected { background:#7c3aed; }
    @keyframes nv-blink { 50% { opacity:0; } }
    #radioToggleBtn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;background:transparent;color:#f5f0ff;border:1px solid #f5f0ff;border-radius:0;cursor:pointer}#radioToggleBtn svg{width:16px;height:16px;display:block}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="ticker"><span id="tickerInfo">LOADING TIME · DATE · LOCATION · WEATHER · TIDES</span></div>
  <main>
    <h1>Infinity 6 Terminal</h1>
    <p id="who">Checking your sign-in…</p>
    <audio id="radioAudio" src="sounds/neon-vigil-theme-atmospheric-haze.mp3" loop preload="none"></audio>
    <nav>
      <a href="https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/">Game — Gigas Garden</a>
      <a href="/nv808/">NV-808</a>
      <a href="https://neonvigil.app/test-web-bible-neon-ultra">Character Sheets — Neon Ultra (test)</a>
    </nav>
    <p class="palette-hint" id="paletteHint">Press ⌘K for commands</p>
  </main>
  <div class="options-footer"><span class="footer-cell"><span id="radio">Radio: <button type="button" id="radioToggleBtn" aria-label="Play Atmospheric Haze" title="Play Atmospheric Haze"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button> <select id="stationSelect" aria-label="Radio station"><option value="0">Atmospheric Haze</option><option value="1">Sound Bed 1</option><option value="2">Sound Bed 2</option><option value="3">Sound Bed 3</option></select></span></span><span class="footer-cell"><button type="button" id="optionsBtn" class="options-icon-btn" aria-label="Options — open commands" title="Options — open commands (⌘K)"><svg width="28" height="28" viewBox="0 0 100 100" fill="none" stroke="#f5f0ff" stroke-width="3" aria-hidden="true"><circle cx="50" cy="50" r="10"/><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="42"/><ellipse cx="50" cy="50" rx="42" ry="16" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="42" ry="16" transform="rotate(120 50 50)"/><circle cx="50" cy="8" r="4" fill="#f5f0ff" stroke="none"/><circle cx="86" cy="71" r="4" fill="#f5f0ff" stroke="none"/><circle cx="14" cy="71" r="4" fill="#f5f0ff" stroke="none"/><path d="M50 44v12M44 50h12" stroke-width="4"/></svg></button></span></div>
  <div class="palette-overlay" id="paletteOverlay"><div class="palette"><input id="paletteInput" placeholder="Type a command…" autocomplete="off" aria-label="Commands"><ul class="palette-list" id="paletteList"></ul></div></div>
  <script src="./auth.js"></script>
  <script>
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function savedName() { return localStorage.getItem('nv_display_name') || ''; }
    function saveNameToAccount(v) {
      try {
        var c = (typeof getClient === 'function') ? getClient() : null;
        if (c) { c.auth.updateUser({ data: { display_name: v } }).catch(function () {}); }
      } catch (e) {}
    }
    function accountName(user) { return (user && user.user_metadata && user.user_metadata.display_name) ? user.user_metadata.display_name : ''; }
    function sizeInput() {
      var inp = document.getElementById('nameInput');
      if (inp) { inp.style.width = Math.max(1, inp.value.length + 1) + 'ch'; }
    }
    function showEdit(prefill) {
      document.getElementById('who').innerHTML = '<span class="user-label">User:</span> <span class="name-cell"><input id="nameInput" maxlength="60" aria-label="Display name" autocomplete="off"><span class="cursor-blink">_</span></span> <span class="save-cell"><button id="saveNameBtn">Save</button></span> <span class="save-cell"><button id="signOutBtn">Sign out</button></span>';
      var inp = document.getElementById('nameInput');
      inp.value = prefill || '';
      sizeInput();
      inp.addEventListener('input', sizeInput);
      inp.addEventListener('input', function () { if (!radioStarted) { radioPlay(); } }, { once: true });
      inp.focus();
      document.getElementById('saveNameBtn').addEventListener('click', function () {
        var v = inp.value.trim();
        if (v) { localStorage.setItem('nv_display_name', v); saveNameToAccount(v); } else { localStorage.removeItem('nv_display_name'); saveNameToAccount(null); }
        renderName();
      });
      document.getElementById('signOutBtn').addEventListener('click', signOut);
    }
    function renderName(user) {
      var name = savedName() || accountName(user);
      if (name) { localStorage.setItem('nv_display_name', name); }
      if (name) {
        document.getElementById('who').innerHTML = '<span class="user-label">User:</span> <span class="name-cell">' + esc(name) + '<span class="cursor-blink">_</span></span> <span class="save-cell"><button id="signOutBtn">Sign out</button></span>';
        document.getElementById('signOutBtn').addEventListener('click', signOut);
      } else {
        showEdit('');
      }
    }

    var radioStations = [
      'sounds/neon-vigil-theme-atmospheric-haze.mp3',
      'sounds/neon-vigil-sound-bed-1-landing-workpage.wav',
      'sounds/neon-vigil-sound-bed-2-practice-page.wav',
      'sounds/neon-vigil-sound-bed-3-loop.wav'
    ];
    /* Radio + play button, unified: one icon-only play/stop button drives the
       radio; the station picker next to it is the option to change station
       (after sign-in, on the hub). Changing station while playing switches
       what plays; while paused it just picks the next station. */
    var radioAudio = document.getElementById('radioAudio');
    var radioStarted = false;
    var radioToggleBtn = document.getElementById('radioToggleBtn');
    var stationSelect = document.getElementById('stationSelect');
    var radioPlaySvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
    var radioStopSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/></svg>';
    function syncRadioBtn() {
      var playing = !radioAudio.paused;
      var name = stationSelect.options[stationSelect.selectedIndex].text;
      radioToggleBtn.innerHTML = playing ? radioStopSvg : radioPlaySvg;
      radioToggleBtn.setAttribute('aria-label', (playing ? 'Stop ' : 'Play ') + name);
      radioToggleBtn.setAttribute('title', (playing ? 'Stop ' : 'Play ') + name);
    }
    function radioPlay() {
      radioStarted = true;
      radioAudio.play().catch(function () {});
      syncRadioBtn();
    }
    function radioPause() { radioAudio.pause(); syncRadioBtn(); }
    radioToggleBtn.addEventListener('click', function () {
      if (radioAudio.paused) { radioPlay(); } else { radioPause(); }
    });
    stationSelect.addEventListener('change', function () {
      var wasPlaying = !radioAudio.paused;
      radioAudio.src = radioStations[Number(this.value)];
      if (wasPlaying) { radioAudio.play().catch(function () {}); }
      syncRadioBtn();
    });
    radioAudio.addEventListener('play', syncRadioBtn);
    radioAudio.addEventListener('pause', syncRadioBtn);
    syncRadioBtn();

    /* Hub ticker: time + date + location + weather + tides.
       Time/date/location/weather reuse the Gigas Garden game ticker (Task 3, neon-vigil-oauth).
       Tides are new: NOAA CO-OPS, nearest tide station to your location, next high/low. */
    var tickerState = { weather: 'WEATHER STANDBY', place: '', tides: 'TIDES STANDBY', coords: null, requested: false };
    function tickerLocale() { return (navigator.languages && navigator.languages[0]) || navigator.language || 'en-US'; }
    function tickerDateTime() {
      var d = new Date(), loc = tickerLocale();
      var date = d.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
      var time = d.toLocaleTimeString(loc, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      return date + ' · ' + time;
    }
    var WMO = [[0, 'CLEAR'], [1, 'MOSTLY CLEAR'], [2, 'PARTLY CLOUDY'], [3, 'OVERCAST'], [48, 'FOG'], [57, 'DRIZZLE'], [67, 'RAIN'], [77, 'SNOW'], [82, 'SHOWERS'], [86, 'SNOW SHOWERS'], [99, 'THUNDERSTORM']];
    function wxCondition(code) { for (var i = 0; i < WMO.length; i++) if (code <= WMO[i][0]) return WMO[i][1]; return 'SKY UNKNOWN'; }
    function useFahrenheit() {
      var region = '';
      try { region = new Intl.Locale(tickerLocale()).maximize().region || ''; } catch (e) { region = (tickerLocale().split('-')[1] || '').toUpperCase(); }
      return ['US', 'LR', 'MM', 'BS', 'BZ', 'KY', 'PW', 'FM', 'MH'].indexOf(region) !== -1;
    }
    function renderTicker() {
      var el = document.getElementById('tickerInfo');
      if (!el) return;
      var parts = [tickerDateTime(), tickerState.place || 'LOCATION —', tickerState.weather, tickerState.tides];
      el.textContent = parts.join(' · ');
    }
    function fetchWeatherAndTides() {
      var c = tickerState.coords;
      if (!c) return;
      var f = useFahrenheit();
      var lat = c.latitude.toFixed(3), lon = c.longitude.toFixed(3);
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&temperature_unit=' + (f ? 'fahrenheit' : 'celsius'))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var cur = d && d.current;
          if (!cur || typeof cur.temperature_2m !== 'number') throw new Error('no weather');
          tickerState.weather = Math.round(cur.temperature_2m) + '°' + (f ? 'F' : 'C') + ' ' + wxCondition(cur.weather_code);
          renderTicker();
        }).catch(function () { tickerState.weather = 'WEATHER OFFLINE'; renderTicker(); });
      if (!tickerState.place) {
        fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=' + encodeURIComponent(tickerLocale().split('-')[0] || 'en'))
          .then(function (r) { return r.json(); })
          .then(function (g) { var nm = g.city || g.locality || g.principalSubdivision || ''; if (nm) { tickerState.place = String(nm).toUpperCase(); renderTicker(); } })
          .catch(function () {});
      }
      /* Tides: NOAA station list is a 2 MB download, so use the Bay stations and pick the nearest. */
      var BAY_STATIONS = [
        { id: '9414290', lat: 37.8063, lon: -122.4659 },
        { id: '9414750', lat: 37.7717, lon: -122.3017 },
        { id: '9414863', lat: 37.9197, lon: -122.4000 },
        { id: '9415144', lat: 38.0480, lon: -122.0380 }
      ];
      var best = BAY_STATIONS[0], bestD = Infinity;
      BAY_STATIONS.forEach(function (s) {
        var dd = (s.lat - parseFloat(lat)) * (s.lat - parseFloat(lat)) + (s.lon - parseFloat(lon)) * (s.lon - parseFloat(lon));
        if (dd < bestD) { bestD = dd; best = s; }
      });
      fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=today&range=24&station=' + best.id + '&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var now = new Date(), next = null;
          (d.predictions || []).forEach(function (pr) {
            var tt = new Date(pr.t.replace(' ', 'T'));
            if (tt > now && !next) next = { type: pr.type, t: tt };
          });
          tickerState.tides = next ? ('TIDE ' + (next.type === 'H' ? 'HIGH' : 'LOW') + ' ' + next.t.toLocaleTimeString(tickerLocale(), { hour: 'numeric', minute: '2-digit' })) : 'TIDES —';
          renderTicker();
        }).catch(function () { tickerState.tides = 'TIDES OFFLINE'; renderTicker(); });
    }
    function useCoords(lat, lon, place) {
      tickerState.coords = { latitude: lat, longitude: lon };
      if (place) tickerState.place = String(place).toUpperCase();
      fetchWeatherAndTides();
      setInterval(fetchWeatherAndTides, 15 * 60 * 1000);
    }
    function requestTickerLocation() {
      if (tickerState.requested) return; tickerState.requested = true;
      function fallback() {
        /* Browser location blocked or timed out: try IP location, then Oakland as home default. */
        fetch('https://ipwho.is/')
          .then(function (r) { return r.json(); })
          .then(function (g) {
            if (g && g.success && g.latitude && g.longitude) useCoords(g.latitude, g.longitude, g.city || '');
            else useCoords(37.8207, -122.2716, 'Oakland');
          })
          .catch(function () { useCoords(37.8207, -122.2716, 'Oakland'); });
      }
      try {
        if (!navigator.geolocation || !window.fetch) { fallback(); return; }
        var done = false;
        var hard = setTimeout(function () { if (!done) { done = true; fallback(); } }, 8000);
        navigator.geolocation.getCurrentPosition(function (pos) {
          if (done) return; done = true; clearTimeout(hard);
          useCoords(pos.coords.latitude, pos.coords.longitude, '');
        }, function () {
          if (done) return; done = true; clearTimeout(hard); fallback();
        }, { enableHighAccuracy: false, timeout: 7000, maximumAge: 15 * 60 * 1000 });
      } catch (e) { fallback(); }
    }
    renderTicker(); setInterval(renderTicker, 1000); requestTickerLocation();
    /* Raycast-style command palette: Cmd/Ctrl+K, type to filter, arrows + Enter to run. */
    var paletteCommands = [
      { name: 'Play Gigas Garden', hint: 'Game', keys: 'game gigas garden play', run: function () { location.href = 'https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/'; } },
      { name: 'Open Character Sheets — Neon Ultra', hint: 'Character Sheets', keys: 'character sheets neon ultra bible', run: function () { location.href = 'https://neonvigil.app/test-web-bible-neon-ultra'; } },
      { name: 'Open Options', hint: 'Options', keys: 'options settings change name delete name', run: function () { location.href = 'options.html'; } },
      { name: 'Play radio', hint: 'Radio', keys: 'radio play music start', run: function () { radioPlay(); } },
      { name: 'Pause radio', hint: 'Radio', keys: 'radio pause music stop', run: function () { radioPause(); } },
      { name: 'Radio: Atmospheric Haze', hint: 'Radio station', keys: 'radio station atmospheric haze theme', run: function () { document.getElementById('stationSelect').value = '0'; radioAudio.src = radioStations[0]; radioPlay(); } },
      { name: 'Radio: Sound Bed 1', hint: 'Radio station', keys: 'radio station sound bed 1', run: function () { document.getElementById('stationSelect').value = '1'; radioAudio.src = radioStations[1]; radioPlay(); } },
      { name: 'Radio: Sound Bed 2', hint: 'Radio station', keys: 'radio station sound bed 2', run: function () { document.getElementById('stationSelect').value = '2'; radioAudio.src = radioStations[2]; radioPlay(); } },
      { name: 'Radio: Sound Bed 3', hint: 'Radio station', keys: 'radio station sound bed 3', run: function () { document.getElementById('stationSelect').value = '3'; radioAudio.src = radioStations[3]; radioPlay(); } },
      { name: 'Sign out', hint: 'Account', keys: 'sign out log out exit', run: function () { signOut(); } }
    ];
    var paletteOpen = false, paletteSel = 0, paletteFiltered = paletteCommands.slice();
    function renderPalette() {
      var list = document.getElementById('paletteList');
      var q = document.getElementById('paletteInput').value.trim().toLowerCase();
      var words = q ? q.split(/\s+/) : [];
      paletteFiltered = paletteCommands.filter(function (c) {
        var hay = (c.name + ' ' + c.keys).toLowerCase();
        return words.every(function (w) { return hay.indexOf(w) !== -1; });
      });
      if (paletteSel >= paletteFiltered.length) paletteSel = Math.max(0, paletteFiltered.length - 1);
      list.innerHTML = paletteFiltered.map(function (c, i) {
        return '<li class="palette-item' + (i === paletteSel ? ' selected' : '') + '" data-i="' + i + '">' + esc(c.name) + '<span class="hint">' + esc(c.hint) + '</span></li>';
      }).join('') || '<li class="palette-item">No command found</li>';
      list.querySelectorAll('.palette-item[data-i]').forEach(function (el) {
        el.addEventListener('click', function () { runPalette(Number(el.getAttribute('data-i'))); });
      });
    }
    function openPalette() { paletteOpen = true; paletteSel = 0; document.getElementById('paletteOverlay').classList.add('open'); document.getElementById('paletteInput').value = ''; renderPalette(); document.getElementById('paletteInput').focus(); }
    function closePalette() { paletteOpen = false; document.getElementById('paletteOverlay').classList.remove('open'); }
    function runPalette(i) { var c = paletteFiltered[i]; if (!c) return; closePalette(); c.run(); }
    document.getElementById('paletteInput').addEventListener('input', function () { paletteSel = 0; renderPalette(); });
    document.getElementById('paletteInput').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); paletteSel = Math.min(paletteFiltered.length - 1, paletteSel + 1); renderPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); paletteSel = Math.max(0, paletteSel - 1); renderPalette(); }
      else if (e.key === 'Enter') { e.preventDefault(); runPalette(paletteSel); }
      else if (e.key === 'Escape') { closePalette(); }
    });
    document.getElementById('paletteOverlay').addEventListener('click', function (e) { if (e.target === this) closePalette(); });
    document.getElementById('paletteHint').addEventListener('click', openPalette);
    document.getElementById('optionsBtn').addEventListener('click', function () { if (paletteOpen) closePalette(); else openPalette(); });
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (paletteOpen) closePalette(); else openPalette(); }
      else if (e.key === 'Escape' && paletteOpen) { closePalette(); }
    });
    requireSession('index.html').then(function (user) {
      if (user) { renderName(user); }
    });
  </script>
<script>
/* iPhone-style background shift: gyro tilt on phone, mouse parallax on desktop. */
(function () {
  var bg = document.querySelector('.bg');
  if (!bg) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
  function apply() {
    cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;
    bg.style.transform = 'translate3d(' + cx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px,0) scale(1.12)';
    if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) { raf = requestAnimationFrame(apply); } else { raf = null; }
  }
  function kick() { if (!raf) raf = requestAnimationFrame(apply); }
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    var nx = (e.clientX / window.innerWidth - 0.5) * 2;
    var ny = (e.clientY / window.innerHeight - 0.5) * 2;
    tx = -nx * 16; ty = -ny * 12; kick();
  }, { passive: true });
  function onTilt(e) {
    if (e.gamma == null || e.beta == null) return;
    var g = Math.max(-45, Math.min(45, e.gamma));
    var b = Math.max(-30, Math.min(30, (e.beta || 0) - 45));
    tx = -(g / 45) * 16; ty = -(b / 30) * 12; kick();
  }
  var motionAsked = false;
  function enableMotion() {
    if (motionAsked) return; motionAsked = true;
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (r) { if (r === 'granted') window.addEventListener('deviceorientation', onTilt); }).catch(function () {});
    } else {
      window.addEventListener('deviceorientation', onTilt);
    }
  }
  document.addEventListener('pointerdown', enableMotion, { once: true });
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
    window.addEventListener('deviceorientation', onTilt);
  }
})();
</script>
</body>
</html>
