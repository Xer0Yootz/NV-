<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinity 6 Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { background:#05010f url("ocean-water.gif") center/cover no-repeat fixed; color:#f5f0ff; font-family:"VT323", "Share Tech Mono", monospace; font-size:18px; margin:0; min-height:100vh; display:grid; place-items:center; }
    main { max-width:560px; padding:32px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.88); }
    button { background:#ff4fd8; color:#05010f; border:0; padding:10px 18px; border-radius:999px; font-weight:700; cursor:pointer; }
    a { color:#a78bfa; }
    .cursor-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite; color:#ffffff; }
    @keyframes nv-blink { 50% { opacity:0; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <h1>Infinity 6 Terminal</h1>
    <p id="who">Checking your sign-in…</p>
    <p id="nameEdit" hidden><input id="nameInput" maxlength="60" placeholder="Put your name here" aria-label="Display name"> <button id="saveNameBtn">Save name</button> <button id="cancelNameBtn">Cancel</button></p>
    <p><button id="signOutBtn">Sign out</button></p>
    <nav>
      <a href="https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/">Game — Gigas Garden</a>
      <a href="https://neonvigil.app/test-pet-game-baby-pigek">Pet game — Baby Pigek (test)</a>
      <a href="https://neonvigil.app/test-web-bible-neon-ultra">Character Sheets — Neon Ultra (test)</a>
    </nav>
  </main>
  <script src="./auth.js"></script>
  <script>
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function savedName() { return localStorage.getItem('nv_display_name') || ''; }
    function renderName() {
      var name = savedName();
      var edit = document.getElementById('nameEdit');
      if (name) {
        edit.hidden = true;
        document.getElementById('who').innerHTML = 'User: ' + esc(name) + '<span class="cursor-blink">_</span> <button id="editNameBtn">Change name</button> <button id="deleteNameBtn">Delete name</button>';
        document.getElementById('editNameBtn').addEventListener('click', function () {
          document.getElementById('nameInput').value = name;
          edit.hidden = false;
          document.getElementById('nameInput').focus();
        });
        document.getElementById('deleteNameBtn').addEventListener('click', function () {
          localStorage.removeItem('nv_display_name');
          renderName();
        });
      } else {
        document.getElementById('who').innerHTML = 'User: <span class="cursor-blink">_</span>';
        document.getElementById('nameInput').value = '';
        edit.hidden = false;
      }
    }
    requireSession('index.html').then(function (user) {
      if (user) { renderName(); }
    });
    document.getElementById('saveNameBtn').addEventListener('click', function () {
      var v = document.getElementById('nameInput').value.trim();
      if (v) { localStorage.setItem('nv_display_name', v); } else { localStorage.removeItem('nv_display_name'); }
      renderName();
    });
    document.getElementById('cancelNameBtn').addEventListener('click', function () {
      document.getElementById('nameEdit').hidden = !!savedName();
    });
    document.getElementById('signOutBtn').addEventListener('click', signOut);
  </script>
</body>
</html>
