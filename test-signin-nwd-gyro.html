<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Vigil — Sign in</title>
  <style>
    body { background:#05010f; color:#f5f0ff; font-family: system-ui, sans-serif; margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 12px 24px; box-sizing:border-box; overflow-x:hidden; }
    .bg { position:fixed; inset:0; background-image:url("ships-bridge.jpg"); background-size:cover; background-position:center; z-index:0; }
    .scrim { position:fixed; inset:0; background:linear-gradient(rgba(5,1,15,.35),rgba(5,1,15,.75)); z-index:1; }
    .ticker { position:fixed; top:0; left:0; right:0; z-index:4; overflow:hidden; white-space:nowrap; padding:10px 12px; font-size:13px; letter-spacing:2px; background:rgba(5,1,15,.72); border-bottom:1px solid #7c3aed; color:#f5f0ff; }
    .hub-label { color:#ffffff; }
    .await-track { display:inline-block; padding-left:0; }
    .await-static { display:inline-block; animation:nv-colors 6s linear infinite; }
    .cursor-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite; color:#ffffff; }
    .await-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite, nv-colors 6s linear infinite; }
    @keyframes nv-scroll { from{transform:translateX(0)} to{transform:translateX(-100%)} }
    @keyframes nv-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes nv-colors { 0%{color:#00f0ff} 25%{color:#ff4fd8} 50%{color:#9d4edd} 75%{color:#f5f0ff} 100%{color:#00f0ff} }
    main { position:relative; z-index:2; max-width:480px; padding:32px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.82); }
    h1 { margin:0 0 8px; } p { color:#c4b5fd; }
    button { background:#ff4fd8; color:#05010f; border:0; padding:12px 20px; border-radius:999px; font-weight:700; cursor:pointer; font-size:16px; transition:background .6s; }
    button:active { background:#000000; color:#f5f0ff; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { margin-top:16px; min-height:1.2em; color:#fda4af; white-space:pre-wrap; }
    a { color:#a78bfa; }
    model-viewer { --poster-color: transparent; }
    .sigil-btn { background:radial-gradient(circle, rgba(0,240,255,.10) 0%, rgba(157,78,221,.10) 45%, transparent 70%); border:0; border-radius:50%; width:112px; height:112px; padding:0; margin:14px auto 0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .sigil-btn svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 3px #00f0ff) drop-shadow(0 0 9px #9d4edd); }
      .cookie-banner { position:fixed; left:12px; right:12px; bottom:12px; z-index:5; max-width:560px; margin:0 auto; padding:14px 16px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.95); color:#f5f0ff; }
    .cookie-banner p { margin:0 0 10px; color:#f5f0ff; }
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="ticker"><span class="hub-label">Hub Status:</span> <span class="await-track"><span class="await-static">Awaiting Sync</span><span class="cursor-blink">_</span></span></div>
  <main>
    <model-viewer src="nwd-logo-test.glb" alt="New World Dysorder logo" camera-controls style="width:100%; height:180px; background:transparent;"></model-viewer>
    <p>Sign in with GitHub or Google to enter the hub.</p>
    <button id="githubBtn">Sign in with GitHub</button>
    <button id="googleBtn" style="margin-left:8px;">Sign in with Google</button>
    <p id="status"></p>
    <p><small>If you are already signed in, you will be sent to the hub.</small></p>
    <button class="sigil-btn" type="button" aria-label="Hexa Sigil"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="60,6 106.8,33 106.8,87 60,114 13.2,87 13.2,33" stroke="#00f0ff" stroke-width="2.6"/><polygon points="60,16 98.1,38 98.1,82 60,104 21.9,82 21.9,38" stroke="#9d4edd" stroke-width="1.2" opacity="0.8"/><polygon points="60,24 91.2,78 28.8,78" stroke="#00f0ff" stroke-width="1.6" opacity="0.9"/><polygon points="60,96 28.8,42 91.2,42" stroke="#9d4edd" stroke-width="1.6" opacity="0.9"/><polygon points="60,44 73.9,52 73.9,68 60,76 46.1,68 46.1,52" stroke="#00f0ff" stroke-width="2"/><circle cx="60" cy="60" r="4.2" fill="#00f0ff" stroke="none"/></svg></button>
  <p style="text-align:center;font-size:13px;">TEST ONLY — GYRO: tilt your phone to move the logo, like Tripo. Tap the logo once to enable motion on iPhone.</p>
  </main>
  <script src="./auth.js"></script>
  <script>
    checkSessionAndRedirect('hub.html');
    document.getElementById('githubBtn').addEventListener('click', signInWithGitHub);
    document.getElementById('googleBtn').addEventListener('click', signInWithGoogle);
  </script>
  <div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Cookie notice">
    <p>This site uses cookies only to keep you signed in.</p>
    <button type="button" id="cookieGotItBtn">Got it</button>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('cookieBanner');
      var btn = document.getElementById('cookieGotItBtn');
      if (!banner || !btn) return;
      try { if (localStorage.getItem('nv-cookie-dismissed') === '1') { banner.style.display = 'none'; return; } } catch (e) {}
      btn.addEventListener('click', function () {
        try { localStorage.setItem('nv-cookie-dismissed', '1'); } catch (e) {}
        banner.style.display = 'none';
      });
    })();
  </script>

  <script>
    (function () {
      var viewer = document.querySelector("model-viewer");
      if (!viewer) return;
      function onTilt(e) {
        var gamma = e.gamma || 0, beta = e.beta || 0;
        var az = Math.max(-60, Math.min(60, gamma));
        var pol = 75 + Math.max(-30, Math.min(30, beta - 45));
        try { viewer.cameraOrbit = az + "deg " + pol + "deg auto"; } catch (err) {}
      }
      function enable() {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission().then(function (r) { if (r === "granted") window.addEventListener("deviceorientation", onTilt); }).catch(function(){});
        } else {
          window.addEventListener("deviceorientation", onTilt);
        }
      }
      viewer.addEventListener("click", enable, { once: true });
    })();
  </script>
</body>
</html>
