<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Vigil — Sign in</title>   <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { background:#05010f; color:#f5f0ff; font-family: "VT323", "Share Tech Mono", monospace; font-size: 18px; margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 12px 24px; box-sizing:border-box; overflow-x:hidden; }
    .bg { position:fixed; inset:0; background-image:url("ships-bridge.jpg"); background-size:cover; background-position:center; z-index:0; }
    .scrim { position:fixed; inset:0; background:linear-gradient(rgba(5,1,15,.35),rgba(5,1,15,.75)); z-index:1; }
    .ticker { position:fixed; top:0; left:0; right:0; z-index:4; overflow:hidden; white-space:nowrap; padding:10px 12px; font-size:13px; letter-spacing:2px; background:rgba(5,1,15,.72); border-bottom:1px solid #7c3aed; color:#f5f0ff; }
    .hub-label { color:#ffffff; }
    .await-track { display:inline-block; padding-left:0; }
    .await-static { display:inline-block; animation:nv-colors 6s linear infinite; }
    .cursor-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite; color:#ffffff; }
    .await-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite, nv-colors 6s linear infinite; }
    @keyframes nv-scroll { from{transform:translateX(0)} to{transform:translateX(-100%)} }
    @keyframes nv-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes nv-colors { 0%{color:#00f0ff} 25%{color:#ff4fd8} 50%{color:#9d4edd} 75%{color:#f5f0ff} 100%{color:#00f0ff} }
    main { position:relative; z-index:2; max-width:560px; margin-top:40px; padding:24px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.82); }
    h1 { margin:0 0 8px; } p { color:#c4b5fd; }
    button { background:#f5f0ff; color:#05010f; border:0; padding:12px 20px; border-radius:999px; font-weight:700; cursor:pointer; font-size:16px; transition:background .6s; }
    button:active { background:#000000; color:#f5f0ff; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { margin-top:16px; min-height:1.2em; color:#fda4af; white-space:pre-wrap; }
    a { color:#a78bfa; }
    .icon-btn svg { width:24px; height:24px; display:block; }
    .icon-btn { padding:12px 14px; }
    .nv-sound-btn{position:fixed;right:16px;bottom:16px;z-index:3;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(18,8,31,.88);color:#f5f0ff;border:1px solid #f5f0ff;border-radius:0;cursor:pointer}.nv-sound-btn svg{width:20px;height:20px;display:block}.nv-sound-btn:disabled{opacity:.5;cursor:wait}
    body.cookie-locked .nv-sound-btn { pointer-events:none; }

    model-viewer { --poster-color: transparent; }
.cookie-banner { position:fixed; left:12px; right:12px; bottom:12px; z-index:5; max-width:560px; margin:0 auto; padding:14px 16px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:rgba(18,8,31,.95); color:#f5f0ff; }
    .cookie-banner p { margin:0 0 10px; color:#f5f0ff; }
    #cookieBlocker { position:fixed; inset:0; z-index:4; background:transparent; }
    body.cookie-locked main, body.cookie-locked .ticker { pointer-events:none; }
    body.cookie-locked #cookieBlocker { display:block; }
    body:not(.cookie-locked) #cookieBlocker { display:none; }
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="ticker"><span class="hub-label">Hub Status:</span> <span class="await-track"><span class="await-static">Awaiting Sync</span></span></div>
  <main>
<audio id="logoDragAudio" src="sounds/neon-vigil-logo-drag.wav" preload="none"></audio>
    <model-viewer src="nwd-logo-test.glb" alt="New World Dysorder logo" camera-controls style="width:100%; height:150px; background:transparent;"></model-viewer>
      <script>var a=document.getElementById('logoDragAudio');var v=document.querySelector('model-viewer');v.addEventListener('pointerdown',function(){a.play()});v.addEventListener('click',function(){a.play()});</script>
    <p>Sign in</p>
    <button id="githubBtn" class="icon-btn" disabled aria-label="Sign in with GitHub" title="Sign in with GitHub"><svg aria-hidden="true" fill="#05010f" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></button>
    <button id="googleBtn" class="icon-btn" disabled style="margin-left:8px; background:#ffffff; border:1px solid #747775;" aria-label="Sign in with Google" title="Sign in with Google"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg></button>
    <p id="status"></p>
  </main>
  <script src="./auth.js"></script>
  <script>
    checkSessionAndRedirect('hub.html');
    document.getElementById('githubBtn').addEventListener('click', signInWithGitHub);
    document.getElementById('googleBtn').addEventListener('click', signInWithGoogle);
  </script>
<audio id="nvSoundBed1" src="sounds/neon-vigil-sound-bed-1-landing-workpage.wav" loop preload="none"></audio>
<button type="button" id="nvSoundBed1Btn" class="nv-sound-btn" disabled aria-label="Play Sound Bed 1" title="Play Sound Bed 1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
<script>
(function () {
  var a = document.getElementById('nvSoundBed1');
  var b = document.getElementById('nvSoundBed1Btn');
  if (!a || !b) return;
  var playSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
  var pauseSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  function sync() {
    b.innerHTML = a.paused ? playSvg : pauseSvg;
    b.setAttribute('aria-label', a.paused ? 'Play Sound Bed 1' : 'Pause Sound Bed 1');
    b.setAttribute('title', a.paused ? 'Play Sound Bed 1' : 'Pause Sound Bed 1');
  }
  function locked() { return document.body.classList.contains('cookie-locked'); }
  b.addEventListener('click', function () {
    if (locked()) return;
    if (a.paused) { a.play().catch(function () {}); } else { a.pause(); }
  });
  a.addEventListener('play', sync);
  a.addEventListener('pause', sync);
  function onFirstTap(e) {
    if (locked()) return;
    if (b.contains(e.target)) return;
    a.play().catch(function () {});
    document.removeEventListener('pointerdown', onFirstTap);
  }
  document.addEventListener('pointerdown', onFirstTap);
  sync();
})();
</script>
  <div id="cookieBlocker" aria-hidden="true"></div>
  <div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Cookie notice">
    <p>This site uses cookies only to keep you signed in.</p>
    <button type="button" id="cookieGotItBtn" class="icon-btn" aria-label="Got it" title="Got it"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('cookieBanner');
      var btn = document.getElementById('cookieGotItBtn');
      var githubBtn = document.getElementById('githubBtn');
      var soundBtn = document.getElementById('nvSoundBed1Btn');
      var googleBtn = document.getElementById('googleBtn');
      if (!banner || !btn) return;
      function unlock() {
        document.body.classList.remove('cookie-locked');
        if (githubBtn) githubBtn.disabled = false;
        if (googleBtn) googleBtn.disabled = false;
        if (soundBtn) soundBtn.disabled = false;
      }
      var dismissed = false;
      try { dismissed = localStorage.getItem('nv-cookie-dismissed') === '1'; } catch (e) {}
      if (dismissed) { banner.style.display = 'none'; unlock(); return; }
      document.body.classList.add('cookie-locked');
      if (githubBtn) githubBtn.disabled = true;
      if (googleBtn) googleBtn.disabled = true;
      if (soundBtn) soundBtn.disabled = true;
      btn.addEventListener('click', function () {
        try { localStorage.setItem('nv-cookie-dismissed', '1'); } catch (e) {}
        banner.style.display = 'none';
        unlock();
      });
    })();
  </script>
</body>
</html>
