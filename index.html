<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Vigil — Sign in</title>
  <style>
    body { background:#05010f; color:#f5f0ff; font-family: system-ui, sans-serif; margin:0; min-height:100vh; display:grid; place-items:center; }
    main { max-width:480px; padding:32px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:#12081f; }
    h1 { margin:0 0 8px; } p { color:#c4b5fd; }
    button { background:#ff4fd8; color:#05010f; border:0; padding:12px 20px; border-radius:999px; font-weight:700; cursor:pointer; font-size:16px; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { margin-top:16px; min-height:1.2em; color:#fda4af; white-space:pre-wrap; }
    a { color:#a78bfa; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <h1>Neon Vigil</h1>
    <p>Sign in with GitHub or Google to enter the hub.</p>
    <button id="githubBtn">Sign in with GitHub</button>
    <button id="googleBtn" style="margin-left:8px;">Sign in with Google</button>
    <p id="status"></p>
    <p><small>If you are already signed in, you will be sent to the hub.</small></p>
  </main>
  <script src="./auth.js"></script>
  <script>
    // Gate page: if a session already exists, go straight to the hub.
    checkSessionAndRedirect('hub.html');
    document.getElementById('githubBtn').addEventListener('click', signInWithGitHub);
    document.getElementById('googleBtn').addEventListener('click', signInWithGoogle);
  </script>
</body>
</html>
