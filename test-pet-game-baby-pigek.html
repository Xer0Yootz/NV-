<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<title>Neon Vigil — Pet Game Test (NOT LIVE)</title>
<style>
  body{margin:0;background:#05010f;color:#f5f0ff;font-family:Monaco,"SF Mono",Menlo,Consolas,monospace;text-align:center;padding:32px 16px}
  main{max-width:640px;margin:0 auto;border:1px solid #7c3aed;border-radius:16px;background:#12081f;padding:24px}
  .test{color:#ff4fd8;font-size:12px;letter-spacing:.2em}
  img{width:320px;max-width:90%;image-rendering:pixelated;border-radius:12px}
  .hop{animation:hop 1s infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  button{background:#f5f0ff;color:#05010f;border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;margin:6px;font-family:inherit}
  .pill{border:1px solid #3a2148;padding:8px 12px;border-radius:999px;display:inline-block;margin-top:12px}
  .sound-btn{background:transparent;color:#f5f0ff;border:1px solid #f5f0ff;border-radius:0;padding:8px 16px;font-family:'VT323',monospace;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <p class="test">TEST ONLY — NOT THE LIVE GAME</p>
  <h1>Baby Pigek — Pet Game Test</h1>
  <p>What the pet game could look like, using the pictures from the ChatGPT “Create Custom Pet” conversation.</p>
  <div><img id="pigek" src="baby-pigek-magenta.jpg" alt="Baby Pigek pixel sprite, wings folded"></div>
  <p><button onclick="show('baby-pigek-magenta.jpg','Baby Pigek pixel sprite, wings folded')">Idle — wings folded</button>
  <button onclick="show('baby-pigek-grey.jpg','Baby Pigek pixel sprite, wings spread')">Flutter — wings spread</button>
  <button onclick="hop()">Hop-bob</button></p>
  <p class="pill">PET: BABY PIGEK · FOLLOW / PERCH · STAGE 1/3</p>
  <p><audio id="soundBed1" src="sounds/neon-vigil-sound-bed-1-landing-workpage.wav" loop preload="auto"></audio>
  <button class="sound-btn" id="soundBed1Btn" onclick="toggleSoundBed1()">▶ Play Sound Bed 1</button></p>
  <p><a href="/" style="color:#a78bfa">Back to sign-in</a></p>
</main>
<script>
  function show(src, alt){ var i=document.getElementById('pigek'); i.src=src; i.alt=alt; i.classList.remove('hop'); }
  function hop(){ var i=document.getElementById('pigek'); i.classList.toggle('hop'); }
  var soundBed1Started = false;
  function toggleSoundBed1(){
    var a = document.getElementById('soundBed1');
    var b = document.getElementById('soundBed1Btn');
    if (a.paused) { a.play(); b.textContent = '⏸ Pause Sound Bed 1'; }
    else { a.pause(); b.textContent = '▶ Play Sound Bed 1'; }
  }
  // Browsers block autoplay: start Sound Bed 1 on the visitor's first tap/click anywhere on the page.
  document.addEventListener('pointerdown', function startSoundBed1(e){
    if (e.target && e.target.id === 'soundBed1Btn') return; // the Play button handles itself via toggle
    if (soundBed1Started) return;
    soundBed1Started = true;
    var a = document.getElementById('soundBed1');
    var b = document.getElementById('soundBed1Btn');
    a.play().then(function(){ b.textContent = '⏸ Pause Sound Bed 1'; }).catch(function(){ soundBed1Started = false; });
  }, { once: false });
</script>
</body>
</html>
