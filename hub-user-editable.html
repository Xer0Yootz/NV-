<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinity 6 Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { background:#05010f; color:#f5f0ff; font-family:"VT323", "Share Tech Mono", monospace; font-size:18px; margin:0; min-height:100vh; display:grid; place-items:center; }
    main { max-width:560px; padding:32px; text-align:center; border:1px solid #7c3aed; border-radius:16px; background:#12081f; }
    button { background:#ff4fd8; color:#05010f; border:0; padding:10px 18px; border-radius:999px; font-weight:700; cursor:pointer; }
    a { color:#a78bfa; }
    .cursor-blink { display:inline-block; animation:nv-blink 1.2s steps(2,start) infinite; color:#ffffff; }
    @keyframes nv-blink { 50% { opacity:0; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <h1>Infinity 6 Terminal</h1>
    <p id="who">Checking your sign-in…</p>
    <p id="nameEdit" hidden><input id="nameInput" maxlength="60" aria-label="Display name"> <button id="saveNameBtn">Save name</button> <button id="cancelNameBtn">Cancel</button> <button id="resetNameBtn">Use sign-in name</button></p>
    <p><button id="signOutBtn">Sign out</button></p>
    <nav>
      <a href="https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/">Game — Gigas Garden</a>
      <a href="https://neonvigil.app/test-pet-game-baby-pigek">Pet game — Baby Pigek (test)</a>
      <a href="https://neonvigil.app/test-web-bible-neon-ultra">Character Sheets — Neon Ultra (test)</a>
    </nav>
  </main>
  <script src="./auth.js"></script>
  <script>
    var signInName = '';
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function displayName() { return localStorage.getItem('nv_display_name') || signInName; }
    function renderName() {
      document.getElementById('who').innerHTML =
        'User: ' + esc(displayName()) + '<span class="cursor-blink">_</span> <button id="editNameBtn">Change name</button>';
      document.getElementById('editNameBtn').addEventListener('click', function () {
        document.getElementById('nameInput').value = displayName();
        document.getElementById('nameEdit').hidden = false;
        document.getElementById('nameInput').focus();
      });
    }
    requireSession('index.html').then(function (user) {
      if (user) {
        signInName = (user.user_metadata && (user.user_metadata.user_name || user.user_metadata.preferred_username || user.email) || user.email || 'you');
        renderName();
      }
    });
    document.getElementById('saveNameBtn').addEventListener('click', function () {
      var v = document.getElementById('nameInput').value.trim();
      if (v) { localStorage.setItem('nv_display_name', v); } else { localStorage.removeItem('nv_display_name'); }
      document.getElementById('nameEdit').hidden = true;
      renderName();
    });
    document.getElementById('cancelNameBtn').addEventListener('click', function () {
      document.getElementById('nameEdit').hidden = true;
    });
    document.getElementById('resetNameBtn').addEventListener('click', function () {
      localStorage.removeItem('nv_display_name');
      document.getElementById('nameEdit').hidden = true;
      renderName();
    });
    document.getElementById('signOutBtn').addEventListener('click', signOut);
  </script>
</body>
</html>
