<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbiont 3D Throw — Test</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05010f; }
  #app { position:fixed; inset:0; }
  #hint {
    position:fixed; left:12px; top:10px; z-index:5;
    font-family:"VT323","Share Tech Mono",monospace; font-size:18px;
    color:#f5f0ff; letter-spacing:1px; pointer-events:none;
    text-shadow:0 0 8px rgba(124,58,237,.8);
  }
  #hint small { display:block; color:#a78bfa; font-size:15px; }
  #back {
    position:fixed; right:12px; top:10px; z-index:5;
    font-family:"VT323","Share Tech Mono",monospace; font-size:16px;
    color:#a78bfa; text-decoration:none; border:1px solid #7c3aed;
    padding:4px 10px; background:rgba(18,8,31,.88);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">SYMBIONT 3D THROW — TEST
  <small>grab the hexagon and fling it — it flies through depth, bounces off the walls, and drifts back. hard flick = deep throw.</small>
</div>
<a id="back" href="/">back to hub</a>
<script src="../avatar-editor/assets/js/three.min.js"></script>
<script>
(function () {
  'use strict';
  /* 3D throw test: the symbiont is a 3D hexagon (extruded) floating in a
     dark room. Drag it to move it in X/Y; fling it and it keeps the flick
     velocity in X/Y and flies INTO the scene (Z) — a hard flick throws it
     deep, it shrinks as it goes away, bounces off the back wall, and comes
     back toward the camera. It tumbles in 3D while it flies. */

  var app = document.getElementById('app');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05010f);
  scene.fog = new THREE.FogExp2(0x05010f, 0.028);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 14);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  app.appendChild(renderer.domElement);

  /* Lights: violet key + lavender fill, so the hexagon reads in the dark. */
  scene.add(new THREE.AmbientLight(0x7c3aed, 0.55));
  var key = new THREE.DirectionalLight(0xa78bfa, 1.1);
  key.position.set(4, 6, 8);
  scene.add(key);
  var rim = new THREE.PointLight(0x32cd32, 0.6, 40);
  rim.position.set(-6, -3, -4);
  scene.add(rim);

  /* The symbiont: an extruded hexagon, violet with a lavender inner ring.
     Built from a hexagon Shape so it reads as the same mark as the 2D hex. */
  function hexShape(r) {
    var s = new THREE.Shape();
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 3 * i - Math.PI / 6;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) s.moveTo(px, py); else s.lineTo(px, py);
    }
    s.closePath();
    return s;
  }
  var geo = new THREE.ExtrudeGeometry(hexShape(1.15), { depth: 0.35, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 2 });
  geo.center();
  var mat = new THREE.MeshStandardMaterial({ color: 0x7c3aed, emissive: 0x2a0a5e, roughness: 0.35, metalness: 0.55 });
  var symbiont = new THREE.Mesh(geo, mat);
  /* Inner ring: a thin lavender hexagon outline floating just in front. */
  var ringGeo = new THREE.RingGeometry(0.62, 0.72, 6, 1);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xa78bfa, side: THREE.DoubleSide });
  var ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.z = 0.24;
  symbiont.add(ring);
  scene.add(symbiont);

  /* A faint grid floor + back wall so depth reads while it flies. */
  var grid = new THREE.GridHelper(24, 24, 0x7c3aed, 0x2a0a5e);
  grid.position.y = -4.2;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  /* Bounds of the room the symbiont can fly in (world units). */
  var BOUNDS = { x: 6.5, y: 4.0, zMin: -9, zMax: 3.5 };
  var BOUNCE_KEEP = 0.72; /* loses 28% speed per wall */
  var FRICTION = 0.45; /* per-second velocity retention while thrown */
  var ROAM_SPEED = 0.9; /* world units per second while roaming */
  var THROW_MAX = 26; /* world units per second — fastest fling */

  var pos = new THREE.Vector3(0, 0, 0);
  var vel = new THREE.Vector3(0, 0, 0);
  var spin = new THREE.Vector3(0, 0, 0); /* angular velocity, rad/s */
  var dragging = false;
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var lastPX = 0, lastPY = 0, lastT = 0;
  var throwV = new THREE.Vector3(0, 0, 0);
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function setPointer(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  }
  function hitsSymbiont(e) {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    return raycaster.intersectObject(symbiont, true).length > 0;
  }
  /* Dragging moves the symbiont on the plane facing the camera at its
     current depth, so it never jumps when you grab it mid-flight. */
  var dragPlane = new THREE.Plane();
  var dragPoint = new THREE.Vector3();
  function planePoint(e) {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 0, 1), pos);
    var p = raycaster.ray.intersectPlane(dragPlane, dragPoint);
    return p ? dragPoint : null;
  }

  var canvas = renderer.domElement;
  canvas.style.touchAction = 'none';
  canvas.style.cursor = 'grab';
  canvas.addEventListener('pointerdown', function (e) {
    if (!hitsSymbiont(e)) return;
    dragging = true;
    canvas.style.cursor = 'grabbing';
    canvas.setPointerCapture(e.pointerId);
    vel.set(0, 0, 0); spin.set(0, 0, 0);
    lastPX = e.clientX; lastPY = e.clientY; lastT = Date.now();
    var p = planePoint(e);
    if (p) { dragOffset.copy(pos).sub(p); }
  });
  var dragOffset = new THREE.Vector3();
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = planePoint(e);
    if (!p) return;
    var nx = p.x + dragOffset.x, ny = p.y + dragOffset.y;
    pos.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, nx));
    pos.y = Math.max(-BOUNDS.y, Math.min(BOUNDS.y, ny));
    var now = Date.now();
    var dt = Math.max(1, now - lastT) / 1000;
    var fx = (e.clientX - lastPX) / dt, fy = -(e.clientY - lastPY) / dt;
    /* Flick velocity in world units: screen px -> world via camera depth. */
    var worldPerPx = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.position.z - pos.z) / window.innerHeight;
    var vx = fx * worldPerPx, vy = fy * worldPerPx;
    /* The Z throw comes from the flick speed: a hard flick throws it deep
       into the scene (away from the camera), a soft flick barely leaves. */
    var flickSpeed = Math.sqrt(vx * vx + vy * vy);
    var vz = -Math.min(THROW_MAX * 0.9, flickSpeed * 0.85);
    throwV.set(
      Math.max(-THROW_MAX, Math.min(THROW_MAX, vx)),
      Math.max(-THROW_MAX, Math.min(THROW_MAX, vy)),
      vz
    );
    spin.set(vy * 0.12, -vx * 0.12, vx * 0.05);
    lastPX = e.clientX; lastPY = e.clientY; lastT = now;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    canvas.style.cursor = 'grab';
    if (reduced) { vel.set(0, 0, 0); spin.set(0, 0, 0); return; }
    /* Throw: keep the flick velocity — X/Y across the screen, Z deep into
       the scene. It flies, bounces, and decays back to roaming. */
    vel.copy(throwV);
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* Roam: when it settles, drift slowly so it never sits dead still. */
  function roamVelocity() {
    var a = Math.random() * Math.PI * 2;
    vel.set(Math.cos(a) * ROAM_SPEED, Math.sin(a) * ROAM_SPEED, (Math.random() - 0.5) * ROAM_SPEED * 0.6);
  }
  roamVelocity();

  var lastFrame = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
    lastFrame = now;
    if (!dragging && !reduced) {
      var speed = vel.length();
      if (speed > ROAM_SPEED) {
        var keep = Math.pow(FRICTION, dt);
        vel.multiplyScalar(keep);
        if (vel.length() <= ROAM_SPEED && vel.length() > 0) {
          vel.setLength(ROAM_SPEED);
        }
      }
      pos.addScaledVector(vel, dt);
      if (pos.x <= -BOUNDS.x) { pos.x = -BOUNDS.x; vel.x = Math.abs(vel.x) * BOUNCE_KEEP; }
      if (pos.x >= BOUNDS.x) { pos.x = BOUNDS.x; vel.x = -Math.abs(vel.x) * BOUNCE_KEEP; }
      if (pos.y <= -BOUNDS.y) { pos.y = -BOUNDS.y; vel.y = Math.abs(vel.y) * BOUNCE_KEEP; }
      if (pos.y >= BOUNDS.y) { pos.y = BOUNDS.y; vel.y = -Math.abs(vel.y) * BOUNCE_KEEP; }
      if (pos.z <= BOUNDS.zMin) { pos.z = BOUNDS.zMin; vel.z = Math.abs(vel.z) * BOUNCE_KEEP; }
      if (pos.z >= BOUNDS.zMax) { pos.z = BOUNDS.zMax; vel.z = -Math.abs(vel.z) * BOUNCE_KEEP; }
      /* Tumble in 3D while it flies; decay the spin as it settles. */
      symbiont.rotation.x += spin.x * dt;
      symbiont.rotation.y += spin.y * dt;
      symbiont.rotation.z += spin.z * dt;
      spin.multiplyScalar(Math.pow(0.25, dt));
    }
    /* Idle bob so it reads as alive even at rest. */
    if (!dragging) {
      symbiont.position.set(pos.x, pos.y + Math.sin(now / 700) * 0.12, pos.z);
    } else {
      symbiont.position.copy(pos);
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
