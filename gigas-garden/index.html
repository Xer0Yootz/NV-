<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    /* Shell-wrapped game page (audit fix, Nov 8, 2026): the Gigas Garden
       game loads in a full-viewport frame INSIDE the app shell (ticker,
       header, dock, Cmd+K) instead of navigating out to GitHub Pages.
       The frame is deliberately unsandboxed so the game behaves exactly
       as it does standalone; sandboxing is a later hardening call. */
    html, body { height: 100%; }
    body { background:#05010f; color:#f5f0ff; font-family:"VT323", "Share Tech Mono", monospace; font-size:18px; margin:0; display:flex; flex-direction:column; }
    .nv-shell-head { max-width:none; margin:0 12px 12px; }
    .nv-frame-wrap { flex:1; min-height:0; margin:0 12px; }
    .nv-frame-wrap iframe { width:100%; height:100%; border:1px solid #7c3aed; display:block; box-sizing:border-box; background:#05010f; }
    .nv-frame-fallback { text-align:center; font-size:14px; color:#a78bfa; margin:10px 0 0; }
    .nv-frame-fallback a { color:#a78bfa; }
  </style>
  <script src="../config.js"></script>
</head>
<body class="nv-shell-page">
  <header class="nv-shell-head">
    <a class="nv-shell-head-title" href="/hub.html">Infinity6 Terminal</a>
    <span class="nv-shell-head-page">Virtual IWW: Gigas Garden</span>
    <span class="nv-shell-head-hint" data-nv-commands>Press ⌘K for commands</span>
  </header>
  <div class="nv-frame-wrap">
    <iframe src="https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/" title="Virtual IWW: Gigas Garden" allowfullscreen></iframe>
  </div>
  <p class="nv-frame-fallback">If the game does not load in this frame, <a href="https://xer0yootz.github.io/neon-vigil-oauth/gigas-garden/" target="_blank" rel="noopener">open the Gigas Garden directly</a>.</p>
  <script src="../auth.js"></script>
  <script src="../nv-ticker.js"></script>
  <script src="../nv-commands.js"></script>
  <script src="../nv-shell.js"></script>
</body>
</html>
